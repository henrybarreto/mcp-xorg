[project]
name = "mcp-xorg"
version = "0.1.0"
description = "MCP server that drives a headless xpra X11 desktop via pyautogui"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
mcp-xorg = "mcp_xorg.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_xorg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_xorg --cov-report=term-missing"
